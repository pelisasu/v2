name: XAUUSD AGI Quant Trading Bot

on:
  schedule:
    # Berjalan otomatis setiap 15 menit
    - cron: '*/15 * * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore Signal Cache State
      uses: actions/cache@v4
      with:
        path: .state_cache/
        key: quant-state-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          quant-state-${{ runner.os }}-

    - name: Execute Quant Engine Pipeline
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        MIN_CONFLUENCE_SCORE: "75.0"
        SIGNAL_COOLDOWN_MINUTES: "60"
      run: |
        python quant_engine.py

    - name: Save Signal Cache State
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .state_cache/
        key: quant-state-${{ runner.os }}-${{ github.run_id }}
